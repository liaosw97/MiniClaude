<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>claude-tap Viewer</title>
<style>
/* Design Tokens — CSS Variables */
:root {
  --bg: #f8f9fb;
  --bg-card: #ffffff;
  --bg-hover: #f0f2f5;
  --bg-active: #e8ecf4;
  --bg-code: #f6f8fa;
  --border: #e2e4e9;
  --scrollbar-bg1: #bbbec7;
  --border-light: #edeef1;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.10);
  --gap-xs: 4px;
  --gap-sm: 8px;
  --gap: 12px;
  --gap-md: 16px;
  --gap-lg: 24px;
  --pad-sm: 8px;
  --pad: 12px;
  --pad-md: 16px;
  --pad-lg: 24px;
  --radius: 10px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --transition-fast: 0.15s;

  --text: #1c2024;
  --text-secondary: #60646c;
  --text-tertiary: #a0a4ab;

  --blue: #3b82f6;
  --blue-bg: #eff6ff;
  --green: #10b981;
  --green-bg: #ecfdf5;
  --amber: #f59e0b;
  --amber-bg: #fffbeb;
  --red: #ef4444;
  --red-bg: #fef2f2;
  --red-bg-hi: #fecaca;
  --green-bg-hi: #bbf7d0;
  --purple: #8b5cf6;
  --purple-bg: #f5f3ff;
  --cyan: #06b6d4;
  --cyan-bg: #ecfeff;
  --orange: #f97316;
  --orange-bg: #fff7ed;
  --indigo: #6366f1;
  --bg-input: #ffffff;
  --shadow-color: rgba(0,0,0,0.06);
  --shadow-color-heavy: rgba(0,0,0,0.12);
  --text-code: #1c2024;
  --scrollbar-thumb: #bbbec7;
  --scrollbar-track: transparent;

  --accent-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6);

  --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace;
  --sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
  --font-size-xs: 10px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-lg: 16px;
}

[data-theme="dark"] {
  --bg: #0d1117;
  --bg-card: #161b22;
  --bg-hover: #21262d;
  --bg-active: #2d333b;
  --bg-code: #0d1117;
  --border: #373e47;
  --border-light: #2d333b;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.4);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.5);
  --text: #e6edf3;
  --text-secondary: #8b949e;
  --text-tertiary: #8b949e;
  --blue: #58a6ff;
  --blue-bg: #0d2240;
  --green: #3fb950;
  --green-bg: #0d2d1a;
  --amber: #d29922;
  --amber-bg: #2d2200;
  --red: #f85149;
  --red-bg: #3d1117;
  --red-bg-hi: #6b2020;
  --green-bg-hi: #1a5c33;
  --purple: #bc8cff;
  --purple-bg: #1f1338;
  --cyan: #39d2c0;
  --cyan-bg: #0a2e2c;
  --orange: #f0883e;
  --orange-bg: #2d1b00;
  --indigo: #8b8fff;
  --bg-input: #0d1117;
  --shadow-color: rgba(0,0,0,0.3);
  --shadow-color-heavy: rgba(0,0,0,0.5);
  --text-code: #e6edf3;
  --scrollbar-thumb: #484f58;
  --scrollbar-track: transparent;
  --accent-gradient: linear-gradient(135deg, #58a6ff, #bc8cff);
}

[data-theme="dark"] .msg.user { border-color: #1f3a5f; }
[data-theme="dark"] .msg.assistant { border-color: #1a3a26; }
[data-theme="dark"] .msg.system { border-color: #3d3000; }
[data-theme="dark"] .msg.tool_result { border-color: #2a1f48; }
[data-theme="dark"] .msg pre, [data-theme="dark"] .msg .pre-text { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.06); }
[data-theme="dark"] .content-block.block-framed { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.08); }
[data-theme="dark"] .json-view .jk { color: #bc8cff; }
[data-theme="dark"] .json-view .js { color: #3fb950; }
[data-theme="dark"] .json-view .jn { color: #d29922; }
[data-theme="dark"] .json-view .jb { color: #f85149; }
[data-theme="dark"] .json-view .json-punct { color: #6e7681; }
[data-theme="dark"] .jt-toggle { color: #6e7681; }
[data-theme="dark"] .jt-toggle:hover { color: #c9d1d9; }
[data-theme="dark"] .jt-summary { color: #6e7681; }


/* Shared Layout — Header, Controls, Global */

*,*::before,*::after { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }

/* ─── Header ─── */
.header {
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px; min-height: 44px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; z-index: 10;
  position: relative;
}
.header::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: var(--accent-gradient);
}
.header .logo { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.header .logo svg { width: 22px; height: 22px; }
.header .logo span {
  font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: -0.3px;
  background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header .logo .logo-version { font-size: 11px; color: var(--text-tertiary); margin-left: 4px; }

/* ─── Theme Toggle ─── */
.theme-toggle {
  background: none; border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 4px 8px; cursor: pointer; font-size: 16px; color: var(--text);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.theme-toggle:hover { background: var(--bg-hover); }

/* ─── Language Select ─── */
.lang-select {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 4px 8px; font-size: 12px; color: var(--text); cursor: pointer;
}

/* ─── Stats ─── */
.stats {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: var(--text-secondary);
  margin-left: auto;
}
.stats .stat-item { display: flex; align-items: center; gap: 4px; }
.stats .stat-value { font-weight: 600; color: var(--text); }

/* ─── Path Filter ─── */
.path-filter {
  display: flex; align-items: center; gap: 6px;
  flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden;
  scrollbar-width: none; -ms-overflow-style: none;
  flex: 1; min-width: 0;
}
.path-filter::-webkit-scrollbar { display: none; }
.filter-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 999px;
  font-size: 11px; font-weight: 500; white-space: nowrap;
  border: 1px solid var(--border); background: var(--bg-card);
  color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
  user-select: none;
}
.filter-chip:hover { background: var(--bg-hover); border-color: var(--blue); color: var(--blue); }
.filter-chip.active { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); font-weight: 600; }
.filter-chip .chip-count { font-size: 10px; opacity: 0.7; }

/* ─── Viewer Actions ─── */
.viewer-actions { display: flex; align-items: center; gap: 6px; }
.viewer-actions .act-btn {
  background: none; border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 4px 10px; font-size: 11px; color: var(--text-secondary);
  cursor: pointer; transition: all 0.15s;
}
.viewer-actions .act-btn:hover { background: var(--bg-hover); color: var(--text); }

/* ─── Trace Path Bar ─── */
.trace-path-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 20px; font-size: 11px; color: var(--text-tertiary);
  background: var(--bg); border-bottom: 1px solid var(--border-light);
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  min-height: 28px;
}
.trace-path-bar:empty { display: none; }

/* ─── Main Layout ─── */
.main {
  display: flex; flex: 1; overflow: hidden;
}

/* ─── Sidebar ─── */
.sidebar-wrap {
  width: 320px; min-width: 240px; max-width: 480px;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--border);
  background: var(--bg-card);
  overflow: hidden;
  resize: horizontal;
}

/* ─── Search Input ─── */
.search-input {
  width: 100%; padding: 8px 12px;
  border: none; border-bottom: 1px solid var(--border-light);
  background: var(--bg-card); color: var(--text);
  font-size: 13px; outline: none; transition: background 0.15s;
}
.search-input::placeholder { color: var(--text-tertiary); }
.search-input:focus { background: var(--bg-hover); border-bottom-color: var(--blue); }

/* ─── Sidebar Sort ─── */
.sidebar-sort {
  display: flex; align-items: center; gap: 0;
  padding: 6px 12px; border-bottom: 1px solid var(--border-light);
}
.sidebar-sort .sidebar-sort-segment {
  padding: 3px 10px; font-size: 11px; font-weight: 500;
  color: var(--text-tertiary); cursor: pointer;
  border: 1px solid transparent; border-radius: 999px;
  transition: all 0.15s;
}
.sidebar-sort .sidebar-sort-segment:hover { color: var(--text-secondary); background: var(--bg-hover); }
.sidebar-sort .sidebar-sort-segment.active {
  color: var(--blue); background: var(--blue-bg); border-color: var(--blue);
}

/* ─── Tool Filter ─── */
.tool-filter {
  display: flex; flex-wrap: wrap; gap: 4px;
  padding: 6px 12px; border-bottom: 1px solid var(--border-light);
}
.tool-filter:empty { display: none; }
.tool-filter .tool-chip {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 8px; border-radius: 999px;
  font-size: 10px; font-weight: 500;
  border: 1px solid var(--border); background: var(--bg-card);
  color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
}
.tool-filter .tool-chip:hover { border-color: var(--purple); color: var(--purple); }
.tool-filter .tool-chip.active { background: var(--purple-bg); border-color: var(--purple); color: var(--purple); }

/* ─── Position Indicator ─── */
.position-indicator {
  height: 3px; background: var(--border-light); position: relative;
}
.position-indicator .position-bar {
  position: absolute; top: 0; left: 0; height: 100%;
  background: var(--blue); border-radius: 2px;
  transition: width 0.15s ease;
}

/* ─── Date Picker ─── */
.date-picker {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; border-bottom: 1px solid var(--border-light);
}
.date-picker select {
  flex: 1; padding: 4px 8px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); font-size: 12px; color: var(--text);
}
.date-picker button {
  padding: 4px 8px; background: var(--red-bg); border: 1px solid var(--red);
  border-radius: var(--radius-sm); font-size: 11px; color: var(--red);
  cursor: pointer;
}
.date-picker button:hover { background: var(--red-bg-hi); }

/* ─── Detail Panel ─── */
.detail {
  flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0;
  background: var(--bg);
}

/* ─── Error Banner ─── */
.error-banner {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; margin: 12px 16px 0;
  background: var(--red-bg); border: 1px solid var(--red);
  border-radius: var(--radius-sm); font-size: 12px; color: var(--red);
}

/* ─── Continuation Banner ─── */
.continuation-banner {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; margin: 12px 16px 0;
  background: var(--amber-bg); border: 1px solid var(--amber);
  border-radius: var(--radius-sm); font-size: 12px; color: var(--amber);
}

/* ─── Drop Zone ─── */
.drop-zone {
  flex: 1; display: flex; align-items: center; justify-content: center;
  background: var(--bg);
}
.drop-zone-inner {
  text-align: center; padding: 48px 40px;
  border: 2px dashed var(--border); border-radius: var(--radius);
  color: var(--text-tertiary); font-size: 14px;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.drop-zone.drag-over .drop-zone-inner,
.drop-zone-inner:hover {
  border-color: var(--blue);
  box-shadow: 0 0 0 4px var(--blue-bg);
}
.drop-zone-inner .drop-icon {
  font-size: 48px; margin-bottom: 12px; opacity: 0.4;
}
.drop-zone-inner p { margin-top: 8px; }
.drop-zone-inner .drop-hint {
  font-size: 12px; color: var(--text-tertiary); margin-top: 4px; opacity: 0.7;
}

@keyframes pulse-border {
  0%, 100% { border-color: var(--border); }
  50% { border-color: var(--blue); }
}
.drop-zone.waiting .drop-zone-inner {
  animation: pulse-border 2s ease-in-out infinite;
}

/* ─── Mobile Back Button ─── */
.mobile-back-btn {
  position: fixed; bottom: 60px; left: 16px;
  padding: 8px 16px; background: var(--blue); color: white;
  border: none; border-radius: var(--radius-sm);
  font-size: 13px; cursor: pointer; z-index: 100;
  box-shadow: var(--shadow-md);
}

/* ─── Mobile Nav Bar ─── */
.mobile-nav-bar {
  display: flex; align-items: center; justify-content: center; gap: 16px;
  padding: 8px; background: var(--bg-card);
  border-top: 1px solid var(--border);
}
.mobile-nav-bar button {
  padding: 6px 16px; background: var(--bg-hover);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 14px; cursor: pointer; color: var(--text);
}

/* ─── Global Search Overlay ─── */
.global-search-overlay {
  position: fixed; top: 0; left: 0; right: 0;
  background: var(--bg-card); border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-md); z-index: 1000;
  padding: 12px 20px;
}
.global-search-box {
  display: flex; align-items: center; gap: 8px;
  max-width: 600px; margin: 0 auto;
}
.global-search-box input {
  flex: 1; padding: 6px 12px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-sm); font-size: 13px; color: var(--text);
  outline: none;
}
.global-search-box input:focus { border-color: var(--blue); }
.global-search-count { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.global-search-box button {
  padding: 4px 8px; background: var(--bg-hover);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 12px; cursor: pointer; color: var(--text);
}
.global-search-box button:hover { background: var(--bg-active); }

/* ─── Global Search Highlight ─── */
.global-search-hit {
  background: var(--amber-bg); outline: 2px solid var(--amber);
  border-radius: 2px;
}
.global-search-hit.current {
  background: var(--amber); color: var(--bg);
}

/* ─── Responsive ─── */
@media (max-width: 900px) {
  .sidebar-wrap { width: 100%; max-width: none; border-right: none; }
  .main { flex-direction: column; }
  .header { padding: 0 12px; gap: 8px; }
  .path-filter { display: none; }
}

@media (max-width: 768px) {
  .header .logo span { display: none; }
  .stats { display: none; }
  .search-input { font-size: 16px; }
}


/* Viewer-specific Styles */

/* ─── Sidebar Items ─── */
.sidebar {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 4px 0;
}
.sidebar.virtual-scroll {
  position: relative;
  overflow-y: auto;
}
.sidebar-item {
  display: grid; align-items: flex-start; gap: 10px;
  padding: 8px 12px; cursor: pointer;
  border-bottom: 1px solid var(--border-light);
  border-left: 3px solid transparent;
  transition: background 0.15s, border-color 0.15s;
  position: relative;
  font-size: 0.96rem;
}
.sidebar-item:hover { background: var(--bg-hover); }
.sidebar-item.active {
  background: var(--bg-active);
  border-left-color: var(--blue);
}
.sidebar-item.is-error { border-left: 3px solid var(--red); }

.sidebar-item .item-turn {
  font-size: 11px; font-weight: 600; color: var(--text-tertiary);
  min-width: 24px; text-align: right;
}
.sidebar-item .item-model {
  font-size: 10px; padding: 1px 6px;
  border-radius: 999px; font-weight: 500;
  white-space: nowrap;
}
.sidebar-item .item-summary {
  flex: 1; min-width: 0;
  font-size: 12px; color: var(--text-secondary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sidebar-item .item-time {
  font-size: 10px; color: var(--text-tertiary);
  white-space: nowrap;
}
.sidebar-item .item-tokens {
  font-size: 10px; color: var(--text-tertiary);
  white-space: nowrap;
}

/* ─── Sidebar Group Header ─── */
.sidebar-group-header {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px; font-size: 11px; font-weight: 600;
  color: var(--text-secondary); background: var(--bg);
  border-bottom: 1px solid var(--border-light);
  cursor: pointer; user-select: none;
}
.sidebar-group-header:hover { background: var(--bg-hover); }
.sidebar-group-header .group-count {
  font-size: 10px; font-weight: 400; color: var(--text-tertiary);
}

/* ─── Time Gap ─── */
.time-gap {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 12px; font-size: 10px; color: var(--text-tertiary);
}
.time-gap::before, .time-gap::after {
  content: ''; flex: 1; height: 1px; background: var(--border-light);
}

/* ─── Session Hover Tooltip ─── */
.session-hover-tooltip {
  position: absolute; left: 100%; top: 0;
  padding: 8px 12px; background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  box-shadow: var(--shadow-md); font-size: 11px;
  white-space: nowrap; z-index: 50;
  pointer-events: none;
}

/* ─── Action Bar ─── */
.action-bar {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-bottom: 1px solid var(--border-light);
  background: var(--bg-card);
}
.act-btn {
  background: none; border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 4px 10px;
  font-size: 11px; color: var(--text-secondary);
  cursor: pointer; transition: all 0.15s;
}
.act-btn:hover { background: var(--bg-hover); color: var(--text); border-color: var(--blue); }

/* ─── Detail Inspector Bar ─── */
.detail-inspector-bar {
  display: flex; align-items: center; gap: 0;
  padding: 0 16px; border-bottom: 1px solid var(--border-light);
  background: var(--bg-card);
}
.detail-tab {
  padding: 8px 14px; font-size: 12px; font-weight: 500;
  color: var(--text-tertiary); cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.detail-tab:hover { color: var(--text-secondary); }
.detail-tab.active { color: var(--blue); border-bottom-color: var(--blue); }

/* ─── Trace Format Bar ─── */
.trace-format-bar {
  display: flex; align-items: center; gap: 0;
  padding: 0 16px; border-bottom: 1px solid var(--border-light);
  background: var(--bg-card);
}
.trace-format-bar .trace-format-segment {
  padding: 6px 12px; font-size: 11px; font-weight: 500;
  color: var(--text-tertiary); cursor: pointer;
  border: 1px solid transparent; border-radius: 999px;
  transition: all 0.15s;
}
.trace-format-bar .trace-format-segment:hover { color: var(--text-secondary); background: var(--bg-hover); }
.trace-format-bar .trace-format-segment.active {
  color: var(--blue); background: var(--blue-bg); border-color: var(--blue);
}

/* ─── Messages ─── */
.msg {
  margin: 12px 16px; padding: 12px 16px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-card);
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--transition-fast, 0.15s);
}
.msg:hover {
  box-shadow: var(--shadow-md);
}
.msg.user { border-left: 3px solid var(--blue); }
.msg.assistant { border-left: 3px solid var(--green); }
.msg.system { border-left: 3px solid var(--amber); }
.msg.tool_result { border-left: 3px solid var(--purple); }

.msg-role {
  font-size: 14px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.5px; margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.msg-role::before {
  content: '';
  width: 8px; height: 8px;
  border-radius: 50%; flex-shrink: 0;
}
.msg.user .msg-role::before { background: var(--blue); }
.msg.assistant .msg-role::before { background: var(--green); }
.msg.system .msg-role::before { background: var(--amber); }
.msg.tool_result .msg-role::before { background: var(--purple); }
.msg.user .msg-role { color: var(--blue, blue); }
.msg.assistant .msg-role { color: var(--green, green); }
.msg.system .msg-role { color: var(--amber, amber); }
.msg.tool_result .msg-role { color: var(--purple, purple); }

/* ─── Code Block ─── */
.code-block {
  overflow-x: auto;
  max-width: 100%;
  white-space: pre-wrap;
  word-break: break-word;
  background: var(--bg-code);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  padding: var(--pad, 12px);
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.5;
}
pre.code-block {
  white-space: pre-wrap;
  overflow-x: auto;
  background: var(--bg-code);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  padding: var(--pad, 12px);
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.5;
}
.code-block::-webkit-scrollbar {
  height: 6px;
}
.code-block::-webkit-scrollbar-thumb {
  background: var(--scrollbar-thumb, #bbbec7);
  border-radius: 3px;
}
.code-block::-webkit-scrollbar-track {
  background: var(--scrollbar-track, transparent);
}
.trace-content {
  word-break: break-word;
  overflow-wrap: break-word;
  max-width: 100%;
}

/* ─── Loading State ─── */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  color: var(--text-secondary);
  font-size: 13px;
}
.loading::before {
  content: '';
  width: 16px;
  height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 8px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ─── Icon Sizes ─── */
.theme-icon {
  display: inline-block;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: linear-gradient(90deg, var(--text) 50%, transparent 50%);
  position: relative;
}
.theme-icon::before {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--bg-card);
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.model-pill {
  font-size: 1rem;
  padding: 1px;
  border-radius: 999px;
  font-weight: 500;
  white-space: nowrap;
}

.content-block { margin-top: 8px; }
.content-block.block-framed {
  padding: 8px 12px; background: var(--bg);
  border: 1px solid var(--border-light); border-radius: var(--radius-sm);
}

.tool-use-label {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; background: var(--purple-bg);
  border: 1px solid var(--purple); border-radius: 999px;
  font-size: 11px; font-weight: 500; color: var(--purple);
}

.thinking-label {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; background: var(--cyan-bg);
  border: 1px solid var(--cyan); border-radius: 999px;
  font-size: 11px; font-weight: 500; color: var(--cyan);
}

/* ─── Tool Blocks ─── */
.tool-block {
  margin: 8px 16px; padding: 10px 14px;
  background: var(--bg); border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
}
.tool-block-header {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 600; color: var(--purple);
  margin-bottom: 8px;
}
.tb-param {
  display: flex; gap: 8px;
  font-size: 11px; color: var(--text-secondary);
  padding: 3px 0;
  border-bottom: 1px solid var(--border-light);
}
.tb-param:last-child { border-bottom: none; }
.tb-param .param-key { color: var(--text-tertiary); }
.tb-param .param-value { color: var(--text); }

/* ─── Token Bar ─── */
.token-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: var(--gap, 12px);
  padding: var(--pad, 12px) var(--pad-md, 16px);
  font-size: 11px;
  background: var(--bg-card);
  margin: 0 16px 12px;
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
}
.token-bar .token-item {
  display: flex; flex-direction: column; gap: 2px;
  padding: 8px;
  background: var(--bg);
  border-radius: var(--radius-sm);
}
.token-bar .token-item .token-label {
  font-size: 10px; color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: 0.3px;
}
.token-bar .token-item .token-value {
  font-size: 14px; font-weight: 700; color: var(--text);
}
.token-bar .token-item .progress-bar {
  width: 100%; height: 4px;
  background: var(--border-light);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 4px;
}
.token-bar .token-item .progress-bar .progress-fill {
  height: 100%; border-radius: 2px;
  background: var(--accent-gradient);
  transition: width 0.3s ease;
}

/* ─── JSON View ─── */
.json-view { font-family: var(--mono); font-size: 12px; line-height: 1.5; overflow-x: auto; max-width: 100%; }
.json-view .jt-line { padding: 1px 0; }
.json-view .jt-toggle {
  cursor: pointer; user-select: none;
  display: inline-block; width: 14px; text-align: center;
  color: var(--text-tertiary); font-size: 10px;
}
.json-view .jt-toggle:hover { color: var(--text); }
.json-view .jt-summary { color: var(--text-tertiary); font-style: italic; }
.json-view .jk { color: var(--purple); }
.json-view .js { color: var(--green); }
.json-view .jn { color: var(--amber); }
.json-view .jb { color: var(--red); }
.json-view .json-punct { color: var(--text-tertiary); }

/* ─── SSE Events ─── */
.sse-event {
  padding: 4px 8px; margin: 4px 0;
  background: var(--bg); border: 1px solid var(--border-light);
  border-radius: var(--radius-sm); font-size: 11px;
}
.sse-type { color: var(--cyan); font-weight: 600; }
.sse-data { color: var(--text-secondary); font-family: var(--mono); font-size: 10px; }

/* ─── Trace View ─── */
.trace-grid {
  display: grid; grid-template-columns: 120px 1fr;
  gap: 1px; background: var(--border-light);
  margin: 8px 16px; border-radius: var(--radius-sm);
  overflow: hidden;
}
.trace-block {
  padding: 6px 10px; background: var(--bg-card);
  font-size: 12px;
}
.trace-code {
  font-family: var(--mono); font-size: 11px;
  white-space: pre-wrap; word-break: break-all;
}
.trace-pretty { font-size: 12px; }
.trace-kv { display: flex; gap: 8px; }
.trace-kv .trace-key { color: var(--text-tertiary); min-width: 80px; }
.trace-kv .trace-value { color: var(--text); }

/* ─── Section ─── */
.section { margin: 8px 16px; }
.section-header {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 16px; font-size: 13px; font-weight: 600;
  color: var(--text-secondary); cursor: pointer;
  user-select: none;
  border-bottom: 1px solid var(--border-light);
  background: var(--bg-card);
  margin: 0;
}
.section-header:hover { color: var(--text); }
.section-header .section-toggle {
  font-size: 10px; color: var(--text-tertiary);
  transition: transform 0.15s;
}
.section-header .section-toggle.collapsed { transform: rotate(-90deg); }
.section-body { padding-left: 16px; }

/* ─── Diff Modal ─── */
.diff-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); z-index: 1000;
  display: flex; align-items: center; justify-content: center;
}
.diff-modal {
  width: 90vw; max-width: 1200px; height: 80vh;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-md);
  display: flex; flex-direction: column; overflow: hidden;
}
.diff-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
}
.diff-header h3 { font-size: 14px; font-weight: 600; }
.diff-header button {
  background: none; border: none; font-size: 18px;
  cursor: pointer; color: var(--text-secondary);
}
.diff-section { padding: 12px 16px; overflow-y: auto; flex: 1; }
.diff-section h4 { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }

.sbs-diff { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; }
.sbs-cell {
  padding: 8px 12px; background: var(--bg);
  font-family: var(--mono); font-size: 11px;
  white-space: pre-wrap; word-break: break-all;
  border: 1px solid var(--border-light);
}
.sbs-cell.added { background: var(--green-bg); }
.sbs-cell.removed { background: var(--red-bg); }
.sbs-cell.unchanged { opacity: 0.5; }

/* ─── Virtual Scroll Position Indicator ─── */
.sidebar.virtual-scroll .position-indicator {
  position: sticky; top: 0; z-index: 5;
}

/* ─── Mobile Responsive ─── */
@media (max-width: 900px) {
  .main {
    flex-direction: column;
  }

  .sidebar-wrap {
    width: 100%;
    max-height: 50vh;
    border-right: none;
    border-bottom: 1px solid var(--border-light);
  }

  .detail {
    width: 100%;
    min-height: 50vh;
  }

  /* Mobile navigation buttons */
  .mobile-back-btn {
    display: block !important;
    position: fixed;
    bottom: 60px;
    left: 16px;
    z-index: 100;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
    box-shadow: var(--shadow-md);
  }

  .mobile-nav-bar {
    display: flex !important;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: var(--bg-card);
    border-top: 1px solid var(--border);
    padding: 8px;
    justify-content: center;
    gap: 16px;
  }

  .mobile-nav-bar button {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }

  .mobile-nav-bar button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* Adjust header for mobile */
  .header {
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px 12px;
  }

  .header .logo {
    font-size: 14px;
  }

  /* Stack filter chips on mobile */
  .path-filter {
    flex-wrap: wrap;
    gap: 4px;
  }

  /* Adjust search input for mobile */
  .search-input {
    font-size: 16px; /* Prevent zoom on iOS */
  }

  /* Diff modal full screen on mobile */
  .diff-modal {
    width: 100vw;
    height: 100vh;
    max-width: none;
    border-radius: 0;
  }

  .sbs-diff {
    grid-template-columns: 1fr;
  }
}

/* ─── Small Mobile (< 480px) ─── */
@media (max-width: 480px) {
  .sidebar-item {
    padding: 6px 8px;
  }

  .sidebar-item .item-model {
    font-size: 9px;
    padding: 1px 4px;
  }

  .sidebar-item .item-summary {
    font-size: 11px;
  }

  .detail-inspector-bar {
    overflow-x: auto;
    white-space: nowrap;
  }

  .detail-tab {
    padding: 6px 10px;
    font-size: 11px;
  }
}

/* ─── Typography ─── */
.section-title {
  font-size: 14px;
  font-weight: 600;
}

/* ─── Detail Section ─── */
.detail-section {
  margin: var(--gap, 12px) var(--pad-md, 16px);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.detail-section-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px;
  background: var(--bg-hover);
  border-bottom: 1px solid var(--border-light);
}
.detail-section-header .section-title {
  font-size: 13px;
}
.detail-section-header .section-badges {
  display: flex; align-items: center; gap: 4px;
  margin-left: 4px;
}
.detail-section-header .section-badge {
  font-size: 10px; font-weight: 500;
  padding: 1px 7px; border-radius: 999px;
  background: var(--bg); color: var(--text-secondary);
  border: 1px solid var(--border-light);
}
.detail-section-content {
  padding: 0;
}

/* ─── Code Block ─── */
.detail-section-content .code-block {
  border: none !important;
  border-radius: 0 !important;
  background: var(--bg-code);
  font-size: 11px;
  line-height: 1.6;
  padding: 12px 16px !important;
  margin: 0;
}
.detail-section-content .code-block.thinking {
  color: var(--text-secondary);
  font-style: italic;
}

/* ─── System Prompt Markdown Rendering ─── */
.sysprompt-wrap {
  padding: 12px 16px;
  font-size: 12px;
  line-height: 1.7;
  background: var(--bg);
}

/* Headings */
.md-heading {
  font-weight: 700;
  color: var(--text);
  margin: 16px 0 8px;
}
.md-h1 { font-size: 16px; border-bottom: 1px solid var(--border-light); padding-bottom: 4px; }
.md-h2 { font-size: 14px; }
.md-h3 { font-size: 13px; }
.md-h4, .md-h5, .md-h6 { font-size: 12px; color: var(--text-secondary); }

/* Paragraphs */
.md-paragraph {
  margin: 6px 0;
  color: var(--text);
  line-height: 1.7;
}

/* Inline code */
.md-inline-code {
  font-family: var(--mono);
  font-size: 11px;
  background: var(--bg-code);
  border: 1px solid var(--border-light);
  border-radius: 3px;
  padding: 1px 5px;
  color: var(--red);
}

/* Strong */
.md-paragraph strong {
  font-weight: 700;
  color: var(--text);
}

/* Links */
.md-link {
  color: var(--blue);
  text-decoration: underline;
  cursor: pointer;
}
.md-link:hover {
  color: var(--indigo);
}

/* Code blocks */
.md-code-block {
  margin: 10px 0;
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.md-code-lang {
  padding: 3px 10px;
  font-size: 10px;
  font-weight: 600;
  color: var(--text-tertiary);
  background: var(--bg-card);
  border-bottom: 1px solid var(--border-light);
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.md-code-block .code-block {
  margin: 0;
  border: none !important;
  border-radius: 0 !important;
  padding: 10px 12px !important;
  font-size: 11px;
  line-height: 1.5;
  background: var(--bg-code);
  max-height: 400px;
  overflow-y: auto;
}

/* Lists */
.md-list {
  margin: 6px 0;
  padding-left: 24px;
}
.md-list li {
  margin: 3px 0;
  line-height: 1.6;
}

/* Blockquotes */
.md-blockquote {
  margin: 8px 0;
  padding: 6px 12px;
  border-left: 3px solid var(--blue);
  background: var(--blue-bg);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}
.md-blockquote p {
  margin: 0;
  color: var(--text-secondary);
  font-style: italic;
}

/* Horizontal rule */
.md-hr {
  border: none;
  border-top: 1px solid var(--border-light);
  margin: 12px 0;
}

/* ─── XML Highlight Block ─── */
.md-xml-block {
  margin: 10px 0;
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.md-xml-block .code-block {
  margin: 0;
  border: none !important;
  border-radius: 0 !important;
  padding: 10px 12px !important;
  font-size: 11px;
  line-height: 1.6;
  background: var(--bg-code);
  max-height: 500px;
  overflow-y: auto;
}
.md-xml-block .code-block code {
  font-family: var(--mono);
}
.xml-tag {
  color: var(--purple);
  font-weight: 600;
}
.xml-attr {
  color: var(--cyan);
}
.xml-val {
  color: var(--green);
}
.xml-role {
  color: var(--blue);
  font-weight: 600;
}
.xml-note {
  color: var(--amber);
  font-style: italic;
}
.xml-field {
  color: var(--purple);
  font-weight: 600;
}
.xml-role-example {
  color: var(--blue);
  font-weight: 600;
}
.xml-separator {
  color: var(--text-tertiary);
  display: block;
  text-align: center;
  letter-spacing: 2px;
}

/* ─── Tools Table ─── */
.tools-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}
.tool-row {
  border-bottom: 1px solid var(--border-light);
}
.tool-row:last-child {
  border-bottom: none;
}
.tool-row:nth-child(even) {
  background: var(--bg);
}
.tool-name-cell {
  width: 200px;
  padding: 9px 16px;
  vertical-align: top;
}
.tool-name-cell code {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--purple);
}
.tool-desc-cell {
  padding: 9px 16px 9px 0;
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
  word-break: break-word;
}
.tool-no-desc {
  color: var(--text-tertiary);
  font-style: italic;
}

/* ─── Tool Uses ─── */
.tool-uses-list {
  padding: 0;
}
.tool-use-item {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-light);
}
.tool-use-item:last-child {
  border-bottom: none;
}
.tool-use-header {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 6px;
}
.tool-use-icon {
  font-size: 11px; color: var(--text-tertiary);
}
.tool-use-name {
  font-size: 12px; font-weight: 600;
  color: var(--purple);
  font-family: var(--mono);
}
.tool-use-id {
  font-size: 10px; color: var(--text-tertiary);
  font-family: var(--mono);
  margin-left: auto;
}
.tool-use-input .code-block {
  font-size: 10px;
  padding: 8px 12px !important;
  background: var(--bg);
  border: 1px solid var(--border-light) !important;
  border-radius: var(--radius-sm) !important;
  max-height: 300px;
  overflow-y: auto;
}

/* ─── Usage ─── */
.usage-list {
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.usage-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.usage-item-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
}
.usage-label {
  font-weight: 500;
  color: var(--text-secondary);
}
.usage-value {
  font-weight: 700;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
}
.usage-bar {
  height: 6px;
  background: var(--bg);
  border-radius: 3px;
  overflow: hidden;
}
.usage-bar-fill {
  height: 100%;
  border-radius: 3px;
  background: var(--accent-gradient);
  transition: width 0.3s ease;
}
.meta-label {
  font-weight: 600;
  color: var(--text-secondary);
}
.meta-value {
  font-weight: 400;
  color: var(--text);
}

/* ─── Detail Overview ─── */
.detail-overview {
  margin: var(--gap, 12px) var(--pad-md, 16px);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.overview-top-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px;
  background: var(--bg-hover);
  border-bottom: 1px solid var(--border-light);
}
.overview-top-bar .model-pill {
  font-size: 13px; font-weight: 600; color: var(--text);
}
.overview-top-bar .status-pill,
.overview-top-bar .duration-pill {
  font-size: 11px; font-weight: 500;
  padding: 2px 8px; border-radius: 999px;
}
.overview-top-bar .status-pill.success {
  background: var(--green-bg); color: var(--green);
}
.overview-top-bar .status-pill.error {
  background: var(--red-bg); color: var(--red);
}
.overview-top-bar .duration-pill {
  background: var(--bg); color: var(--text-secondary);
  border: 1px solid var(--border-light);
  margin-left: auto;
}

/* Meta Table */
.meta-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  line-height: 1.5;
}
.meta-table tr {
  border-bottom: 1px solid var(--border-light);
}
.meta-table tr:last-child {
  border-bottom: none;
}
.meta-table td {
  padding: 7px 16px;
  vertical-align: middle;
}
.meta-table .meta-label {
  width: 90px;
  font-size: 10px;
  font-weight: 600;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  white-space: nowrap;
  background: var(--bg);
  padding-right: 12px;
}
.meta-table .meta-value {
  color: var(--text);
  font-weight: 400;
  padding-right: 24px;
}
.meta-table .meta-value code {
  font-family: var(--mono);
  font-size: 11px;
  background: var(--bg-code);
  border: 1px solid var(--border-light);
  border-radius: 3px;
  padding: 1px 5px;
}
.meta-table .meta-value.mono {
  font-family: var(--mono);
  font-size: 11px;
}
.meta-table .path-cell {
  max-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.meta-table .path-cell code {
  display: block;
  overflow: hidden;

// src/services/trace/viewer/src/shared/theme.ts
var THEME_KEY = "claude-tap-theme";
function getTheme() {
  return document.documentElement.getAttribute("data-theme") || "light";
}
function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved === "dark" || saved === "light") {
    applyTheme(saved);
  } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
    applyTheme("dark");
  } else {
    applyTheme("light");
  }
}
function toggleTheme() {
  const current = getTheme();
  applyTheme(current === "dark" ? "light" : "dark");
}
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  localStorage.setItem(THEME_KEY, theme);
  const btn = document.getElementById("theme-toggle");
  if (btn) {
    btn.textContent = theme === "dark" ? "☀️" : "\uD83C\uDF19";
    btn.title = theme === "dark" ? "Switch to light mode" : "Switch to dark mode";
  }
}

// src/services/trace/viewer/src/shared/i18n.ts
var LANG_KEY = "claude-tap-lang";
var currentLang = "en";
var i18nData = {};
function initI18n(data) {
  if (!data || typeof data !== "object" || Object.keys(data).length === 0) {
    i18nData = {};
    currentLang = "en";
    return;
  }
  i18nData = data;
  currentLang = detectLang();
  applyI18n();
}
function isI18nEmpty() {
  return Object.keys(i18nData).length === 0;
}
function detectLang() {
  const saved = localStorage.getItem(LANG_KEY);
  if (saved && i18nData[saved])
    return saved;
  const nav = navigator.language || "en";
  if (i18nData[nav])
    return nav;
  const short = nav.split("-")[0];
  if (i18nData[short])
    return short;
  return "en";
}
function t(key, params) {
  let value = i18nData[currentLang]?.[key] || i18nData["en"]?.[key] || key;
  if (params) {
    for (const [k, v] of Object.entries(params)) {
      value = value.replace(`{${k}}`, String(v));
    }
  }
  return value;
}
function setLang(lang) {
  if (!i18nData[lang])
    return;
  currentLang = lang;
  localStorage.setItem(LANG_KEY, lang);
  applyI18n();
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
}
function applyI18n() {
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const key = el.getAttribute("data-i18n");
    if (key)
      el.textContent = t(key);
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
    const key = el.getAttribute("data-i18n-placeholder");
    if (key)
      el.placeholder = t(key);
  });
  document.querySelectorAll("[data-i18n-title]").forEach((el) => {
    const key = el.getAttribute("data-i18n-title");
    if (key)
      el.setAttribute("title", t(key));
  });
}
function renderLangSelect(selectId) {
  const select = document.getElementById(selectId);
  if (!select)
    return;
  select.innerHTML = "";
  const languages = Object.keys(i18nData);
  if (languages.length === 0) {
    const option = document.createElement("option");
    option.value = "en";
    option.textContent = "EN";
    option.selected = true;
    select.appendChild(option);
    return;
  }
  for (const lang of languages) {
    const option = document.createElement("option");
    option.value = lang;
    option.textContent = lang.toUpperCase();
    option.selected = lang === currentLang;
    select.appendChild(option);
  }
  select.addEventListener("change", () => setLang(select.value));
}

// src/services/trace/viewer/src/shared/dom.ts
function $(selector, parent = document) {
  return parent.querySelector(selector);
}
function esc(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function renderMarkdownContent(text) {

    }
    const headingMatch = line.match(/^(#{1,6})\s+(.+)$/);

      html.push(`<div class="md-heading md-h${level}">${esc(title)}</div>`);
      i++;

    }
    if (/^---+\s*$/.test(line)) {

    }
    if (line.startsWith("> ")) {
      const quoteLines = [line.slice(2)];
      i++;
      while (i < lines.length && lines[i].startsWith("> ")) {
        quoteLines.push(lines[i].slice(2));
        i++;
      }
      html.push(`<blockquote class="md-blockquote"><p>${esc(quoteLines.join(`
`))}</p></blockquote>`);
      continue;

    }
    if (/^\d+\.\s+/.test(line)) {

      i++;
      while (i < lines.length && /^\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\d+\.\s+/, ""));
        i++;
      }
      const listHtml = items.map((item) => `<li>${esc(item)}</li>`).join("");
      html.push(`<ol class="md-list">${listHtml}</ol>`);

    }
    if (line.trim() === "") {

      const xmlLines = [line];

      i++;

          xmlLines.push(next);
          i++;

        }
        xmlLines.push(next);

      continue;
    }
    const paraLines = [line];
    i++;
    while (i < lines.length && lines[i].trim() !== "" && !lines[i].startsWith("```") && !/^#{1,6}\s/.test(lines[i])) {

function renderInlineMarkdown(text) {

  text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

}
function renderXmlHighlight(text) {
  const escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const lines = escaped.split(`
`);
  const result = [];
  for (const line of lines) {
    const trimmed = line.trimStart();
    const indent = line.slice(0, line.length - trimmed.length);
    let processed = trimmed.replace(/(&lt;)(\/?)(\w[\w-]*)((?:\s+(?:[\w-]+(?:=(?:"[^"]*"|'[^']*'|[\w-]+))?))*)\s*(\/?)(&gt;)/g, (_match, lt, slash, tagName, attrs, selfClose, gt) => {
      const attrsHighlighted = attrs.replace(/ ([\w-]+)(=)/g, ' <span class="xml-attr">$1</span>$2').replace(/="([^"]*)"/g, '=<span class="xml-val">"$1"</span>').replace(/='([^']*)'/g, "=<span class='xml-val'>'$1'</span>");
      return `${lt}<span class="xml-tag">${slash}${tagName}</span>${attrsHighlighted}${selfClose}${gt}`;
    });
    processed = processed.replace(/^(user|assistant):/gmi, '<span class="xml-role-example">$1</span>:');
    processed = processed.replace(/\[(saved|saves|save)[^\]]*\]/gi, '<span class="xml-note">$&</span>');
    processed = processed.replace(/\b(name|description|when_to_save|how_to_use|body_structure|type)\b(?=\s*:)/gi, '<span class="xml-field">$1</span>');
    processed = processed.replace(/^---+$/gm, '<span class="xml-separator">$&</span>');
    result.push(indent + processed);
  }
  return result.join(`
`);
}

function dedupEntries(entries) {
  const seen = new Set;
  const result = [];
  for (const entry of entries) {
    if (!seen.has(entry.request_id)) {
      seen.add(entry.request_id);
      result.push(entry);
    }
  }
  if (result.length > MAX_DEDUP_ENTRIES) {
    return result.slice(-MAX_DEDUP_ENTRIES);
  }
  return result;
}

    if ((e.ctrlKey || e.metaKey) && e.key === "f") {
      e.preventDefault();
      openGlobalSearch();
    }
    if (e.key === "Escape") {
      closeGlobalSearch();
    }
    const target = e.target;
    if (target.tagName === "INPUT" || target.tagName === "TEXTAREA") {
      return;
    }
    switch (e.key) {
      case "j":
        e.preventDefault();
        selectNext();
        break;
      case "k":
        e.preventDefault();
        selectPrev();
        break;
      case "Home":
        e.preventDefault();
        selectFirst();
        break;
      case "End":
        e.preventDefault();
        selectLast();
        break;
      case "PageDown":
        e.preventDefault();
        for (let i = 0;i < 10; i++)
          selectNext();
        break;
      case "PageUp":
        e.preventDefault();
        for (let i = 0;i < 10; i++)

        break;

  });

async function loadHistoricalData() {
  try {
    const response = await fetch("/api/sessions");
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    const sessions = await response.json();
    if (!sessions || sessions.length === 0) {
      return [];
    }
    const latestSession = sessions[0];
    const tracesResponse = await fetch(`/api/traces/${latestSession.id}`);
    if (!tracesResponse.ok) {
      throw new Error(`HTTP ${tracesResponse.status}`);
    }
    const traces = await tracesResponse.json();
    return Array.isArray(traces) ? traces : [];
  } catch (error) {
    console.error("Failed to load historical data:", error);
    const sidebar = $("#sidebar");
    if (sidebar) {
      sidebar.innerHTML = '<div class="error-banner">Failed to load history. Waiting for live traces...</div>';
    }
    return [];
  }

async function exportSelfContainedHtml() {
  if (state6.entries.length === 0) {
    alert("No trace data to export");
    return;
  }
  try {
    const resp = await fetch("/");
    if (!resp.ok)
      throw new Error(`Failed to fetch template: ${resp.status}`);
    const template = await resp.text();
    const jsonStr = JSON.stringify(state6.entries);
    const dataBase64 = btoa(unescape(encodeURIComponent(jsonStr)));
    const exportHtml = template.replace("</head>", `<script>window._traceData = JSON.parse(decodeURIComponent(escape(atob('${dataBase64}'))));<` + `/script></head>`);
    const blob = new Blob([exportHtml], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `trace-export-${new Date().toISOString().slice(0, 19).replace(/:/g, "-")}.html`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (err) {

    alert(`Export failed: ${err}`);

    },
    onStatusChange: (status) => {
      updateLiveStatus(status);
    },
    onError: (error) => {
      console.error("SSE error:", error);
    }
  });
  state6.sseManager.connect();
  showMainArea();
  initViewerPanels();
  renderSidebar();
}
function initEmbeddedMode() {
  const data = window._traceData;
  if (data && Array.isArray(data)) {
    state6.entries = data;
    showMainArea();
    initViewerPanels();
    renderSidebar();
  }
}
function initLazyMode() {
  const meta = window.EMBEDDED_TRACE_META;
  if (meta && Array.isArray(meta)) {
    state6.entries = meta;
    showMainArea();
    initViewerPanels();
    renderSidebar();
  }
}
function main() {
  initCommonUi();
  initKeyboardNavigation();
  const mode = detectMode();
  state6.mode = mode;
  console.log(`Viewer mode: ${mode}`);
  switch (mode) {
    case "live":
      initLiveMode();
      break;
    case "embedded":
      initEmbeddedMode();
      break;
    case "lazy":
      initLazyMode();
      break;
    case "file-drop":
    default:
      initFileDropZone();
      break;
  }
}
main();

// ====== Diff 对比功能 ======
function getCurrentSessionId() {
  const params = new URLSearchParams(window.location.search)
  const sessionParam = params.get('session')
  if (sessionParam) return sessionParam
  const firstEntry = $('#sidebar')?.querySelector('[data-session-id]')
  return firstEntry?.getAttribute('data-session-id') || ''
}

async function triggerDiff(turn) {
  if (turn <= 1) return
  const sessionId = getCurrentSessionId()
  if (!sessionId) {
    alert('无法获取会话 ID')
    return
  }
  try {
    const res = await fetch(`/api/sessions/${sessionId}/diff?turn=${turn}`)
    if (!res.ok) throw new Error(`HTTP ${res.status}`)
    const data = await res.json()
    showDiff(data.diff || [])
  } catch (err) {
    console.error('Diff failed:', err)
    alert('Diff 请求失败: ' + err.message)
  }
}

function showDiff(diff) {
  const overlay = document.createElement('div')
  overlay.className = 'diff-overlay'
  overlay.innerHTML = `
    <div class="diff-header">
      <span class="diff-title">请求对比</span>
      <span class="diff-close" onclick="this.closest('.diff-overlay').remove()">&times;</span>
    </div>
    <div class="diff-content" id="diff-content"></div>
  `
  document.body.appendChild(overlay)

  // Escape 键关闭 overlay
  const handleKeydown = (e) => {
    if (e.key === 'Escape') {
      overlay.remove()
      document.removeEventListener('keydown', handleKeydown)
    }
  }
  document.addEventListener('keydown', handleKeydown)

  const content = overlay.querySelector('#diff-content')
  for (const part of diff) {
    const pre = document.createElement('pre')
    pre.className = `diff-${part.op}`
    pre.textContent = part.value
    content.appendChild(pre)
  }
}
